# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — Amazon Linux 2023 Direct Image Execution
# ─────────────────────────────────────────────────────────────────
services:

  backend:
    image: ytnotesmaker-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytnm-backend
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - pdf_output:/app/output
    networks:
      - ytnm-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    image: ytnotesmaker-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ytnm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ytnm-net
    restart: always

networks:
  ytnm-net:
    driver: bridge

volumes:
  pdf_output:
