# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — Optimized for AWS EC2 t3.micro Startup
# ─────────────────────────────────────────────────────────────────
version: '3.9'

services:

  # ── Backend (Flask API + LangGraph) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytnm-backend
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - pdf_output:/app/output
    restart: always

  # ── Frontend (React via Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ytnm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pdf_output:
