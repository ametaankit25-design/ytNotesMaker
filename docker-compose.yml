# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — Lightweight AWS Deployment (Groq Cloud / OpenAI / Ollama)
# ─────────────────────────────────────────────────────────────────
version: '3.9'

services:

  # ── Backend (Flask API + LangGraph) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytnm-backend
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - pdf_output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (React via Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ytnm-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pdf_output:
