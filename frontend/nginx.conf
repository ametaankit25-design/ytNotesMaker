# HTTP server (Port 80)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase buffer sizes to handle large API responses
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # CORS headers for API routes
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # Additional headers to prevent 403 errors
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        
        # Error handling
        proxy_intercept_errors on;
        error_page 403 404 500 502 503 504 = /api_error_handler;
    }

    # Custom error handler for API errors
    location = /api_error_handler {
        default_type application/json;
        return 200 '{"error": "API Error", "message": "The backend service is temporarily unavailable. Please try again later."}';
    }

    # Service worker + manifest must always revalidate
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
