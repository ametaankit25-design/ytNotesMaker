services:
  # Backend - Flask API
  - type: web
    name: ytnotes-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r req.txt
    startCommand: cd backend && python flask_api.py
    envVars:
      - key: PORT
        value: 5000
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health

  # Frontend - React Static Site
  - type: web
    name: ytnotes-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
